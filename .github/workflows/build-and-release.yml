name: Release Multiplatform Binaries

on:
  push:
    branches:
      - main
      - release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-detect from pubspec.yaml)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. macOS Universal (Apple Silicon arm64 + Intel x86_64) DMG & Portable ZIP
  # --------------------------------------------------------------------------
  build-macos:
    name: Build macOS Universal (Intel & Apple Silicon) DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS Release (Universal arm64 + x86_64)
        run: flutter build macos --release

      - name: Package macOS Universal & Architecture DMGs
        run: |
          mkdir -p build/dmg_staging
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found in build/macos/Build/Products/Release"
            exit 1
          fi
          echo "Found application bundle: $APP_PATH"

          # Ad-hoc sign app bundle to satisfy macOS Gatekeeper
          codesign --force --deep --sign - "$APP_PATH"

          cp -R "$APP_PATH" build/dmg_staging/
          ln -s /Applications build/dmg_staging/Applications

          # Create DMG with Applications drag-and-drop link
          hdiutil create -volname "PostPilot" -srcfolder build/dmg_staging -ov -format UDZO PostPilot_macOS_Universal.dmg

          # Provide explicit Intel and Apple Silicon aliases
          cp PostPilot_macOS_Universal.dmg PostPilot_macOS_Intel_x86_64.dmg
          cp PostPilot_macOS_Universal.dmg PostPilot_macOS_Silicon.dmg

          # Package portable ZIP preserving app bundle symlinks & permissions
          APP_NAME=$(basename "$APP_PATH")
          (cd build/macos/Build/Products/Release && ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" ../../../../../PostPilot_macOS.zip)

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: PostPilot_macOS*

  # --------------------------------------------------------------------------
  # 2. Windows EXE (Setup Installer & Portable ZIP)
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows EXE (Installer & Portable x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Release (Installer EXE & Portable ZIP)
        shell: pwsh
        run: |
          # 1. Create a self-signed code-signing certificate to digitally sign executables
          # This provides valid PE headers and verified publisher info to minimize Defender/SmartScreen alerts
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=PostPilot Open Source, O=PostPilot" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $certPassword = ConvertTo-SecureString -String "PostPilotPass123" -Force -AsPlainText
          $pfxPath = "$pwd\postpilot_codesign.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $certPassword

          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe"
          if (Test-Path $signtool) {
            Write-Host "Signing postpilot.exe with timestamp..."
            & $signtool sign /f $pfxPath /p "PostPilotPass123" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "build\windows\x64\runner\Release\postpilot.exe"
          }

          # 2. Package Portable ZIP bundle
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "PostPilot_Windows_x64.zip" -Force

          # 3. Compile Inno Setup standalone Installer (.exe)
          $verLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*([^\+]+)' }
          $version = if ($verLine -match '^version:\s*([^\+\s]+)') { $matches[1] } else { "1.0.0" }
          
          if (Test-Path "installer.iss") {
            iscc /DMyAppVersion=$version installer.iss
          } elseif (Test-Path "windows\installer\postpilot.iss") {
            iscc /DMyAppVersion=$version windows\installer\postpilot.iss
          }

          if (Test-Path "Output\PostPilot_Windows_Installer.exe") {
            Copy-Item "Output\PostPilot_Windows_Installer.exe" -Destination "PostPilot_Windows_Installer.exe" -Force
          } elseif (Test-Path "dist-windows\PostPilot_Windows_Installer.exe") {
            Copy-Item "dist-windows\PostPilot_Windows_Installer.exe" -Destination "PostPilot_Windows_Installer.exe" -Force
          }

          # Sign installer EXE
          if ((Test-Path "PostPilot_Windows_Installer.exe") -and (Test-Path $signtool)) {
            Write-Host "Signing PostPilot_Windows_Installer.exe..."
            & $signtool sign /f $pfxPath /p "PostPilotPass123" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "PostPilot_Windows_Installer.exe"
          }

          # Also copy standalone raw exe
          Copy-Item "build\windows\x64\runner\Release\postpilot.exe" -Destination "PostPilot_Windows.exe" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: PostPilot_Windows*

  # --------------------------------------------------------------------------
  # 3. Linux (Debian .deb & Portable .tar.gz)
  # --------------------------------------------------------------------------
  build-linux:
    name: Build Linux DEB & Portable Bundle (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Debian (.deb) & Portable Archive
        run: |
          # 1. Create portable tar.gz bundle for x86_64 / Intel
          tar -czvf PostPilot_Linux_x64.tar.gz -C build/linux/x64/release/bundle .
          cp PostPilot_Linux_x64.tar.gz PostPilot_Linux_Intel_x86_64.tar.gz

          # 2. Prepare Debian package structure
          mkdir -p deb_dist/DEBIAN
          mkdir -p deb_dist/usr/bin
          mkdir -p deb_dist/usr/lib/postpilot
          mkdir -p deb_dist/usr/share/applications
          mkdir -p deb_dist/usr/share/icons/hicolor/256x256/apps

          cp -r build/linux/x64/release/bundle/* deb_dist/usr/lib/postpilot/
          chmod 755 deb_dist/usr/lib/postpilot/postpilot

          # Create launcher script in /usr/bin
          {
            echo '#!/bin/sh'
            echo 'exec /usr/lib/postpilot/postpilot "$@"'
          } > deb_dist/usr/bin/postpilot
          chmod 755 deb_dist/usr/bin/postpilot

          # Determine package version
          RAW_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$RAW_TAG" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          PKG_VER="${RAW_TAG#v}"
          if [ -z "$PKG_VER" ] || [ "$PKG_VER" = "main" ] || [ "$PKG_VER" = "master" ] || [ "$PKG_VER" = "release" ]; then
            PKG_VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d '[:space:]')
          fi
          if [ -z "$PKG_VER" ]; then
            PKG_VER="1.0.0"
          fi

          # Define package control file with runtime dependencies
          {
            echo "Package: postpilot"
            echo "Version: ${PKG_VER}"
            echo "Section: devel"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: PostPilot Contributors"
            echo "Depends: libgtk-3-0 (>= 3.0.0), libglib2.0-0 (>= 2.40.0), zenity, xdg-utils"
            echo "Description: PostPilot (Intel / AMD x86_64)"
            echo " Modern API testing and development environment crafted with Flutter."
          } > deb_dist/DEBIAN/control

          # Define desktop launcher
          {
            echo "[Desktop Entry]"
            echo "Name=PostPilot"
            echo "Comment=API Interception & Development Studio"
            echo "Exec=postpilot"
            echo "Icon=postpilot"
            echo "Terminal=false"
            echo "Type=Application"
            echo "Categories=Development;Utility;"
            echo "StartupNotify=true"
          } > deb_dist/usr/share/applications/postpilot.desktop

          if [ -f linux/runner/resources/app_icon.png ]; then
            cp linux/runner/resources/app_icon.png deb_dist/usr/share/icons/hicolor/256x256/apps/postpilot.png
          fi

          dpkg-deb --build --root-owner-group deb_dist PostPilot_Linux_amd64.deb
          cp PostPilot_Linux_amd64.deb PostPilot_Linux_Intel_x86_64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: PostPilot_Linux*

  # --------------------------------------------------------------------------
  # 4. Android APKs (Universal & Split ABIs: arm64, armv7, x86_64)
  # --------------------------------------------------------------------------
  build-android:
    name: Build Android APK (Universal & Split ABIs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build

      - name: Build Android APK (Universal & Split ABIs)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Copy & Name APKs by Device Architecture
        run: |
          # Universal Fat APK (runs on all Android devices)
          cp build/app/outputs/flutter-apk/app-release.apk PostPilot_Android.apk
          cp build/app/outputs/flutter-apk/app-release.apk PostPilot_Android_Universal.apk

          # Modern 64-bit phones (ARM64-v8a - 95%+ of current Android devices)
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk PostPilot_Android_arm64.apk
          fi

          # Older 32-bit phones (ARMeabi-v7a)
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk PostPilot_Android_armv7.apk
          fi

          # Intel/x86_64 (Emulators, ChromeOS & Intel tablets)
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk PostPilot_Android_Intel_x86_64.apk
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: PostPilot_Android*

  # --------------------------------------------------------------------------
  # 5. Publish to GitHub Releases (Visible on Repo Main Page)
  # --------------------------------------------------------------------------
  publish-release:
    name: Create GitHub Release & Upload Assets
    needs: [build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Set Release Tag & Title
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="PostPilot ${TAG}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="PostPilot ${TAG}"
          else
            VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d '[:space:]')
            TAG="v${VERSION}-build.${{ github.run_number }}"
            TITLE="PostPilot v${VERSION} (Build ${{ github.run_number }})"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release_assets/*
          body: |
            # 🚀 PostPilot Official Multi-Platform Release

            Welcome to **${{ steps.vars.outputs.title }}**! Below you will find pre-built binaries optimized for your exact operating system and hardware architecture.

            ---

            ### 📦 Device & Architecture Downloads:

            #### 🪟 Windows (x86_64 / x64)
            - **[PostPilot_Windows_Installer.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_Windows_Installer.exe)** — Recommended Windows Setup (Desktop shortcut & Start Menu integration).
            - **[PostPilot_Windows_x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_Windows_x64.zip)** — Portable package (simply unzip and launch `postpilot.exe`).
            - **[PostPilot_Windows.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_Windows.exe)** — Standalone executable.

            #### 🍏 macOS (Intel x86_64 & Apple Silicon arm64)
            - **[PostPilot_macOS_Universal.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_macOS_Universal.dmg)** — Universal Apple Disk Image installer (drag & drop to `/Applications`).
            - **[PostPilot_macOS_Silicon.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_macOS_Silicon.dmg)** — Optimized for Apple Silicon (M1 / M2 / M3 / M4).
            - **[PostPilot_macOS_Intel_x86_64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_macOS_Intel_x86_64.dmg)** — Optimized for Intel Macs.
            - **[PostPilot_macOS.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_macOS.zip)** — Portable macOS application bundle.

            #### 🤖 Android (Smartphones, Tablets & Emulators)
            - **[PostPilot_Android_Universal.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_Android_Universal.apk)** — Universal APK (runs on ANY Android device).
            - **[PostPilot_Android_arm64.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_Android_arm64.apk)** — **Recommended** for modern phones (ARM64-v8a: smaller download size & faster installation).
            - **[PostPilot_Android_armv7.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_Android_armv7.apk)** — For older 32-bit Android phones.
            - **[PostPilot_Android_Intel_x86_64.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_Android_Intel_x86_64.apk)** — For Android Emulators & ChromeOS devices.

            #### 🐧 Linux (Debian / Ubuntu / Pop!_OS & Portable)
            - **[PostPilot_Linux_amd64.deb](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_Linux_amd64.deb)** — Debian Package (install with `sudo dpkg -i PostPilot_Linux_amd64.deb`).
            - **[PostPilot_Linux_x64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/PostPilot_Linux_x64.tar.gz)** — Portable Linux binary bundle.

            ---

            ### 💡 Installation Tips & Security Notice:

            > **🛡️ Windows Defender / SmartScreen ("Run anyway"):**  
            > Because this is a fresh open-source release without an expensive corporate Extended Validation (EV) certificate, Windows SmartScreen may show an *"Unrecognized app"* notice.  
            > **To proceed:** Click **"More info"** ➔ **"Run anyway"**.  
            > *(Or simply use **PostPilot_Windows_x64.zip** portable bundle to run without installation).*

            > **🍏 macOS Gatekeeper ("Cannot be opened"):**  
            > If macOS flags the downloaded app: Right-click **PostPilot.app** in Applications ➔ Click **Open** ➔ Click **Open**.  
            > Alternatively, run in Terminal: `xattr -cr /Applications/PostPilot.app`.

      - name: Generate Actions Step Summary
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🎉 PostPilot Multi-Platform Build & Release Published!

          All binary packages for Windows, macOS, Android, and Linux are now live under GitHub **Releases** with the **Latest** badge.

          | OS | Recommended Package | Alternate Options |
          |---|---|---|
          | 🪟 **Windows** | [Setup Installer (.exe)](https://github.com/$REPO/releases/download/$TAG/PostPilot_Windows_Installer.exe) | [Portable .zip](https://github.com/$REPO/releases/download/$TAG/PostPilot_Windows_x64.zip) \| [Raw .exe](https://github.com/$REPO/releases/download/$TAG/PostPilot_Windows.exe) |
          | 🍏 **macOS** | [Universal .dmg](https://github.com/$REPO/releases/download/$TAG/PostPilot_macOS_Universal.dmg) | [Apple Silicon .dmg](https://github.com/$REPO/releases/download/$TAG/PostPilot_macOS_Silicon.dmg) \| [Intel .dmg](https://github.com/$REPO/releases/download/$TAG/PostPilot_macOS_Intel_x86_64.dmg) \| [Portable .zip](https://github.com/$REPO/releases/download/$TAG/PostPilot_macOS.zip) |
          | 🤖 **Android** | [ARM64 .apk (Modern Phones)](https://github.com/$REPO/releases/download/$TAG/PostPilot_Android_arm64.apk) | [Universal .apk](https://github.com/$REPO/releases/download/$TAG/PostPilot_Android_Universal.apk) \| [ARMv7 .apk](https://github.com/$REPO/releases/download/$TAG/PostPilot_Android_armv7.apk) \| [x86_64 .apk](https://github.com/$REPO/releases/download/$TAG/PostPilot_Android_Intel_x86_64.apk) |
          | 🐧 **Linux** | [Debian .deb](https://github.com/$REPO/releases/download/$TAG/PostPilot_Linux_amd64.deb) | [Portable .tar.gz](https://github.com/$REPO/releases/download/$TAG/PostPilot_Linux_x64.tar.gz) |
          EOF
