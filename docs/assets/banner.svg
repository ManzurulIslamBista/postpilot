<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="PostPilot: the API client for Odoo, Flutter and Git teams">
<defs>
<linearGradient id="wing" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FF4D8D"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6C37"/><stop offset="1" stop-color="#E0306F"/></linearGradient>
<linearGradient id="tail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C21F66"/><stop offset="1" stop-color="#8E1A5B"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1F33"/><stop offset=".6" stop-color="#12141E"/><stop offset="1" stop-color="#1C1230"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".07"/></pattern>
<clipPath id="card"><rect width="1200" height="330" rx="26"/></clipPath>
</defs>
<style>
.blob1{animation:drift1 11s ease-in-out infinite alternate}
.blob2{animation:drift2 13s ease-in-out infinite alternate}
.plane{transform-box:fill-box;transform-origin:center;animation:float 4.2s ease-in-out infinite}
.trail{stroke-dasharray:3 13;animation:flow 1.6s linear infinite}
.title{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
.tag{animation:rise 1.1s .25s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:chip 13.0s ease-in-out infinite}
@keyframes drift1{to{transform:translate(-90px,60px)}}
@keyframes drift2{to{transform:translate(70px,-50px)}}
@keyframes float{0%,100%{transform:translateY(-8px) rotate(-3deg)}50%{transform:translateY(10px) rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes chip{0%{opacity:0;transform:translateY(8px)}2%,18.0%{opacity:1;transform:none}20.0%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="1200" height="330" fill="url(#bg)"/>
<rect width="1200" height="330" fill="url(#dots)"/>
<circle class="blob1" cx="1010" cy="70" r="150" fill="#FF6C37" fill-opacity=".30" filter="url(#blur)"/>
<circle class="blob2" cx="1110" cy="300" r="170" fill="#FF4D8D" fill-opacity=".26" filter="url(#blur)"/>
<circle class="blob2" cx="120" cy="300" r="120" fill="#FF6C37" fill-opacity=".16" filter="url(#blur)"/>
<path class="trail" d="M-10 292 C 70 330 120 300 150 258" fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(68,64) scale(.34) translate(-236,-236)"><g class="plane">
<g filter="url(#soft)" opacity=".55"><polygon points="800,236 236,486 446,586" fill="#FF6C37"/><polygon points="800,236 446,586 592,810" fill="#FF4D8D"/></g>
<polygon points="800,236 236,486 446,586" fill="url(#wing)"/>
<polygon points="800,236 446,586 592,810" fill="url(#body)"/>
<polygon points="446,586 592,810 396,742" fill="url(#tail)"/>
<polyline points="800,236 446,586" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
</g></g>
<text class="title" x="296" y="170" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" fill="url(#brand)" letter-spacing="-2">PostPilot</text>
<text class="tag" x="300" y="216" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#C9CEDC">The API client for Odoo, Flutter and Git teams.</text>
<g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<g class="chip" style="animation-delay:-0.30s;opacity:1"><rect x="300" y="244" width="182" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="url(#brand)" stroke-opacity=".7"/><text x="391" y="270" text-anchor="middle" font-size="19" font-weight="600" fill="#ffd9c7">Odoo Studio</text></g><g class="chip" style="animation-delay:2.30s;opacity:0"><rect x="300" y="244" width="321" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="url(#brand)" stroke-opacity=".7"/><text x="460" y="270" text-anchor="middle" font-size="19" font-weight="600" fill="#ffd9c7">Flutter + Dart codegen</text></g><g class="chip" style="animation-delay:4.90s;opacity:0"><rect x="300" y="244" width="245" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="url(#brand)" stroke-opacity=".7"/><text x="422" y="270" text-anchor="middle" font-size="19" font-weight="600" fill="#ffd9c7">Git-native teams</text></g><g class="chip" style="animation-delay:7.50s;opacity:0"><rect x="300" y="244" width="233" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="url(#brand)" stroke-opacity=".7"/><text x="416" y="270" text-anchor="middle" font-size="19" font-weight="600" fill="#ffd9c7">Production lock</text></g><g class="chip" style="animation-delay:10.10s;opacity:0"><rect x="300" y="244" width="333" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="url(#brand)" stroke-opacity=".7"/><text x="466" y="270" text-anchor="middle" font-size="19" font-weight="600" fill="#ffd9c7">CLI + MCP for AI agents</text></g>
</g>
</g>
<rect x=".75" y=".75" width="1198.5" height="328.5" rx="25.5" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1.5"/>
</svg>
