<g style="opacity:0;animation:l0 24.0s linear infinite"><text x="28" y="74" font-size="13" textLength="483.6" lengthAdjust="spacing"><tspan fill="#FF4D8D" font-weight="700">$</tspan> <tspan fill="#EDEFF6">dart run bin/postpilot.dart run workspace.json --env Staging</tspan></text><g style="animation:c0 24.0s linear infinite"><rect x="43.6" y="59" width="474.0" height="21" fill="#0C0F16"/><rect style="opacity:0;animation:k0 24.0s linear infinite" x="43.6" y="60" width="8" height="18" fill="#FF7A45"/></g></g><g style="opacity:0;animation:l1 24.0s ease-out infinite"><text x="28" y="97" font-size="13" xml:space="preserve"><tspan fill="#5BD98A">✔</tspan> <tspan fill="#5BD98A" font-weight="700">GET  </tspan> <tspan fill="#5BD98A">200</tspan> <tspan fill="#7C849A">  104 ms</tspan>  <tspan fill="#D7DBE8">Shop API / Orders / List posts</tspan>  <tspan fill="#7C849A">(2/2 tests)</tspan></text></g><g style="opacity:0;animation:l2 24.0s ease-out infinite"><text x="28" y="120" font-size="13" xml:space="preserve"><tspan fill="#5BD98A">✔</tspan> <tspan fill="#5BD98A" font-weight="700">GET  </tspan> <tspan fill="#5BD98A">200</tspan> <tspan fill="#7C849A">   36 ms</tspan>  <tspan fill="#D7DBE8">Shop API / Orders / Get a post</tspan>  <tspan fill="#7C849A">(2/2 tests)</tspan></text></g><g style="opacity:0;animation:l3 24.0s ease-out infinite"><text x="28" y="143" font-size="13" xml:space="preserve"><tspan fill="#5BD98A">✔</tspan> <tspan fill="#FFC24B" font-weight="700">POST </tspan> <tspan fill="#5BD98A">201</tspan> <tspan fill="#7C849A">  341 ms</tspan>  <tspan fill="#D7DBE8">Shop API / Orders / Create a post</tspan>  <tspan fill="#7C849A">(1/1 tests)</tspan></text></g><g style="opacity:0;animation:l4 24.0s ease-out infinite"><text x="28" y="166" font-size="13" xml:space="preserve"><tspan fill="#5BD98A">✔</tspan> <tspan fill="#5BD98A" font-weight="700">GET  </tspan> <tspan fill="#5BD98A">200</tspan> <tspan fill="#7C849A">   28 ms</tspan>  <tspan fill="#D7DBE8">Shop API / Orders / Get a user</tspan>  <tspan fill="#7C849A">(2/2 tests)</tspan></text></g><g style="opacity:0;animation:l5 24.0s ease-out infinite"><text x="28" y="189" font-size="13" xml:space="preserve"><tspan fill="#5BD98A" font-weight="700">4 requests, 4 passed, 0 failed</tspan><tspan fill="#7C849A"> in 0.54 s</tspan></text></g><g style="opacity:0;animation:l6 24.0s linear infinite"><text x="28" y="235" font-size="13" textLength="507.0" lengthAdjust="spacing"><tspan fill="#FF4D8D" font-weight="700">$</tspan> <tspan fill="#EDEFF6">dart run bin/postpilot.dart run workspace.json --env Production</tspan></text><g style="animation:c6 24.0s linear infinite"><rect x="43.6" y="220" width="497.4" height="21" fill="#0C0F16"/><rect style="opacity:0;animation:k6 24.0s linear infinite" x="43.6" y="221" width="8" height="18" fill="#FF7A45"/></g></g><g style="opacity:0;animation:l7 24.0s ease-out infinite"><text x="28" y="258" font-size="13" xml:space="preserve"><tspan fill="#FF7B7B">Production lock: 1 selected request would change data in production, so nothing was sent.</tspan></text></g><g style="opacity:0;animation:l8 24.0s ease-out infinite"><text x="28" y="281" font-size="13" xml:space="preserve"><tspan fill="#FFC24B">  POST   Shop API / Orders / Create a post: environment "Production" looks like production</tspan></text></g><g style="opacity:0;animation:l9 24.0s ease-out infinite"><text x="28" y="304" font-size="13" xml:space="preserve"><tspan fill="#9AA3B8">Pass --allow-production to send them anyway, or select only read-only requests</tspan></text></g><g style="opacity:0;animation:l10 24.0s ease-out infinite"><text x="28" y="327" font-size="13" xml:space="preserve"><tspan fill="#9AA3B8">with --collection or --folder.</tspan></text></g><g style="opacity:0;animation:l11 24.0s ease-out infinite"><text x="28" y="350" font-size="13" xml:space="preserve"><tspan fill="#FF7B7B" font-weight="700">exit code 2</tspan><tspan fill="#7C849A">  (nothing was sent)</tspan></text></g>
