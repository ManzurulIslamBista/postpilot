<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="How PostPilot fits: your API or Odoo server, the app, a Git repository, CI and AI agents">
<defs>
<linearGradient id="wing" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FF4D8D"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6C37"/><stop offset="1" stop-color="#E0306F"/></linearGradient>
<linearGradient id="tail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C21F66"/><stop offset="1" stop-color="#8E1A5B"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF7A45"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171A2B"/><stop offset="1" stop-color="#150F26"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".06"/></pattern>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
<clipPath id="card"><rect width="900" height="300" rx="20"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
.halo{animation:halo 3.2s ease-in-out infinite}
.node{animation:bob 5s ease-in-out infinite}
.n2 .node{animation-delay:-1.2s} .n3 .node{animation-delay:-2.4s} .n4 .node{animation-delay:-3.6s}
@keyframes halo{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="900" height="300" fill="url(#bg)"/><rect width="900" height="300" fill="url(#dots)"/>
<rect class="halo" x="346" y="96" width="212" height="76" rx="30" fill="url(#brand)" filter="url(#glow)"/>
<path d="M246 118 C 290 118 300 118 344 118" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M344 142 C 300 142 290 142 246 142" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M560 108 C 610 90 640 70 690 70" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M690 92 C 640 110 610 126 560 128" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M780 100 C 780 130 780 150 780 176" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M560 152 C 610 170 640 196 690 206" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M452 244 C 452 224 452 206 452 180" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
<g class="n2"><g class="node"><rect x="46" y="96" width="200" height="68" rx="16" fill="#1B1F33" stroke="#fff" stroke-opacity="0.12"/><text x="146.0" y="128.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Your API</text><text x="146.0" y="148.0" text-anchor="middle" font-size="13" fill="#9AA3B8">REST, GraphQL, Odoo</text></g></g>
<g><g class="node"><rect x="344" y="90" width="216" height="88" rx="16" fill="url(#brand)" stroke="#fff" stroke-opacity="0.28"/><text x="452.0" y="132.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">PostPilot</text><text x="452.0" y="152.0" text-anchor="middle" font-size="13" fill="#FFE6DA">desktop, mobile, web, CLI</text></g></g>
<g class="n3"><g class="node"><rect x="690" y="40" width="180" height="60" rx="16" fill="#1B1F33" stroke="#fff" stroke-opacity="0.12"/><text x="780.0" y="68.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Git repository</text><text x="780.0" y="88.0" text-anchor="middle" font-size="13" fill="#9AA3B8">workspace.json</text></g></g>
<g class="n4"><g class="node"><rect x="690" y="176" width="180" height="60" rx="16" fill="#1B1F33" stroke="#fff" stroke-opacity="0.12"/><text x="780.0" y="204.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CI pipeline</text><text x="780.0" y="224.0" text-anchor="middle" font-size="13" fill="#9AA3B8">JUnit, Markdown, triage</text></g></g>
<g class="n2"><g class="node"><rect x="364" y="244" width="176" height="44" rx="16" fill="#1B1F33" stroke="#fff" stroke-opacity="0.12"/><text x="452.0" y="264.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">AI agent</text><text x="452.0" y="284.0" text-anchor="middle" font-size="13" fill="#9AA3B8">over MCP</text></g></g>
<text x="296" y="104" text-anchor="middle" font-size="12" fill="#8890A6">requests</text><text x="296" y="164" text-anchor="middle" font-size="12" fill="#8890A6">responses</text>
<text x="628" y="66" text-anchor="middle" font-size="12" fill="#8890A6">pull / push</text><text x="826" y="146" text-anchor="middle" font-size="12" fill="#8890A6">every push</text><text x="612" y="214" text-anchor="middle" font-size="12" fill="#8890A6">headless run</text><text x="500" y="222" text-anchor="middle" font-size="12" fill="#8890A6">MCP</text>
<circle r="4.5" fill="#FF7A45"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M246 118 C 290 118 300 118 344 118"/></circle><circle r="4.5" fill="#FF7A45"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M246 118 C 290 118 300 118 344 118"/></circle><circle r="4.5" fill="#FF4D8D"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M344 142 C 300 142 290 142 246 142"/></circle><circle r="4.5" fill="#FF4D8D"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M344 142 C 300 142 290 142 246 142"/></circle><circle r="4.5" fill="#FF7A45"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M560 108 C 610 90 640 70 690 70"/></circle><circle r="4.5" fill="#FF4D8D"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M690 92 C 640 110 610 126 560 128"/></circle><circle r="4.5" fill="#FF7A45"><animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" path="M780 100 C 780 130 780 150 780 176"/></circle><circle r="4.5" fill="#FF4D8D"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M560 152 C 610 170 640 196 690 206"/></circle><circle r="4.5" fill="#FF7A45"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M452 244 C 452 224 452 206 452 180"/></circle><circle r="4.5" fill="#FF4D8D"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M452 244 C 452 224 452 206 452 180"/></circle>
</g>
<rect x=".75" y=".75" width="898.5" height="298.5" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>
</svg>
